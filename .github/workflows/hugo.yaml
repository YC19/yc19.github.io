name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main  # This is your source branch

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # This is required for the gh-pages branch

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: recursive  # Fetch Hugo themes
        fetch-depth: 0

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v2
      with:
        hugo-version: '0.146.0'  # Updated to match theme requirements
        extended: true

    - name: Build Hugo site
      run: |
        hugo mod get -u ./...
        hugo --minify --gc

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        publish_branch: gh-pages
        force_orphan: true  # This ensures a clean deployment
        commit_message: "Deploy Hugo site to GitHub Pages"

